aai:
   version: v19
   endpoint: https://aai.onap:8443
spring:
   application:
      name: so-cnfm-lcm
   liquibase:
      change-log: classpath:db/changelog/db.changelog-master.xml
   datasource:
      hikari:
         camunda:
            jdbcUrl: jdbc:mariadb://${DB_HOST}:${DB_PORT}/camundabpmn
            username: ${DB_USERNAME}
            password: ${DB_PASSWORD}
            driver-class-name: org.mariadb.jdbc.Driver
            pool-name: bpmn-pool
            registerMbeans: true
         cnfm:
            jdbcUrl: jdbc:mariadb://${DB_HOST}:${DB_PORT}/cnfm
            username: ${DB_ADMIN_USERNAME}
            password: ${DB_ADMIN_PASSWORD}
            driver-class-name: org.mariadb.jdbc.Driver
            pool-name: cnfm-pool
            registerMbeans: true
   servlet:
      multipart:
         enabled: true
management:
   tracing:
      enabled: ${TRACING_ENABLED:false}
      sampling:
         probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
      propagation:
         type:
            - w3c
            - b3
   otlp:
      tracing:
         endpoint: ${TRACING_COLLECTOR_URL:http://jaeger-collector.istio-system:4318}/v1/traces
cnfm:
   kube-configs-dir: /app/kube-configs
server:
   port: 9888
   tomcat:
      max-threads: 50
camunda:
   bpm:
      history-level: full
      job-execution:
         max-pool-size: 30
         core-pool-size: 3
         deployment-aware: true
      generic-properties:
         properties:
            enforce-history-time-to-live: false
sdc:
  username: mso
  endpoint: http://sdc-be.onap:8080
         