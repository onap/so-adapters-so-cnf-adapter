#aai:
#  endpoint: https://aai.onap:30233
#logging:
#  path: logs

aai:
  enabled: false

spring:
  application:
    name: so-cnf-adapter
  main:
    allow-bean-definition-overriding: true
  security:
    usercredentials:
      - username: ${ACTUATOR_USERNAME}
        password: ${ACTUATOR_PASSWORD}
        role: ACTUATOR

management:
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type:
        - w3c
        - b3
  zipkin:
    tracing:
      endpoint: ${COLLECTOR_URL:http://jaeger-collector.istio-system:9411}/api/v2/spans


